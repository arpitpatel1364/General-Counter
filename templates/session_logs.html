<!DOCTYPE html>

<head>

  <script>
    (function() {
      var savedTheme = localStorage.getItem('app-theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <button class="sidebar-toggle-btn" id="sidebarToggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">

      </button>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div class="page-header-title">
        <h1>Session Logs</h1>
        <div class="subtitle">Real-time tracking of session events, stops, starts, renames, and counting changes</div>
      </div>
      <div class="topbar-actions">
        <button id="themeToggle" class="btn btn-secondary icon-btn" aria-label="Toggle Theme">
          <svg id="themeIconDark" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="themeIconLight" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <div class="filter-bar card" style="display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; padding: 24px;">
        <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px;">
          <label for="cameraFilter" style="font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Camera</label>
          <div style="position: relative;">
            <svg style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
            <select id="cameraFilter" style="width: 100%; height: 44px; padding: 8px 36px 8px 40px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg-input, transparent); color: var(--text-primary); font-family: inherit; font-size: 14px; font-weight: 500; appearance: none; outline: none; transition: all 0.2s; cursor: pointer;">
              <option value="">All Cameras</option>
            </select>
            <svg style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 8px; flex: 2; min-width: 240px;">
          <label for="searchFilter" style="font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Search Session</label>
          <div style="position: relative;">
            <svg style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="searchFilter" placeholder="Search by session name..." style="width: 100%; height: 44px; padding: 8px 16px 8px 40px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg-input, transparent); color: var(--text-primary); font-family: inherit; font-size: 14px; font-weight: 500; outline: none; transition: all 0.2s;">
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px;">
          <label for="activityFilter" style="font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;">Event Type</label>
          <div style="position: relative;">
            <svg style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            <select id="activityFilter" style="width: 100%; height: 44px; padding: 8px 36px 8px 40px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg-input, transparent); color: var(--text-primary); font-family: inherit; font-size: 14px; font-weight: 500; appearance: none; outline: none; transition: all 0.2s; cursor: pointer;">
              <option value="">All Events</option>
              <option value="start">Start</option>
              <option value="stop">Stop</option>
              <option value="pause">Pause</option>
              <option value="resume">Resume</option>
              <option value="rename">Rename</option>
            </select>
            <svg style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted);" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>

      <div class="card mt-16" style="padding: 0; overflow: hidden; border-radius: var(--radius-lg);">
        <div style="overflow-x: auto; max-height: 600px;">
          <table class="log-table" style="width: 100%; border-collapse: collapse; text-align: left;">
            <thead style="position: sticky; top: 0; z-index: 10; background: var(--bg-surface-hover); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);">
              <tr>
                <th style="padding: 18px 24px; font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-subtle);">Logged Time</th>
                <th style="padding: 18px 24px; font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-subtle);">Camera</th>
                <th style="padding: 18px 24px; font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-subtle);">Session</th>
                <th style="padding: 18px 24px; font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-subtle);">Activity</th>
                <th style="padding: 18px 24px; font-size: 12px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-subtle);">Details</th>
              </tr>
            </thead>
            <tbody id="logsTableBody">
              <tr>
                <td colspan="5" style="text-align: center; padding: 48px; color: var(--text-muted);">
                  <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 16px; opacity: 0.5;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                  <div>Loading logs...</div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      
      <div id="paginationControls" style="display:flex; justify-content:center; align-items:center; gap:16px; margin-top:24px; display:none;">
        <button id="btnPrevPage" class="btn btn-secondary">Previous</button>
        <span id="pageIndicator" style="font-size:14px; font-weight:600; color:var(--text-secondary);">Page 1</span>
        <button id="btnNextPage" class="btn btn-secondary">Next</button>
      </div>
    </div>
  </main>

  <script>
    (async () => {
      const logsTableBody = document.getElementById("logsTableBody");
      const cameraFilter = document.getElementById("cameraFilter");
      const searchFilter = document.getElementById("searchFilter");
      const activityFilter = document.getElementById("activityFilter");
      
      const paginationControls = document.getElementById("paginationControls");
      const btnPrevPage = document.getElementById("btnPrevPage");
      const btnNextPage = document.getElementById("btnNextPage");
      const pageIndicator = document.getElementById("pageIndicator");

      let currentPage = 1;
      const limit = 20;
      let totalItems = 0;
      let logsData = [];

      // Load cameras
      try {
        const res = await fetch("/api/cameras");
        const cams = await res.json();
        cams.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.name; // Keep as actual name for backend query
          opt.textContent = c.name;
          cameraFilter.appendChild(opt);
        });
      } catch (err) {
        console.error("Failed to load cameras for filter", err);
      }

      // Fetch activity logs
      async function fetchLogs() {
        try {
          const camVal = encodeURIComponent(cameraFilter.value);
          const searchVal = encodeURIComponent(searchFilter.value.trim());
          const actVal = encodeURIComponent(activityFilter.value);
          
          let url = `/api/sessions/activity-logs?page=${currentPage}&limit=${limit}`;
          if (camVal) url += `&camera=${camVal}`;
          if (searchVal) url += `&search=${searchVal}`;
          if (actVal) url += `&activity=${actVal}`;
          
          const res = await fetch(url);
          const responseData = await res.json();
          logsData = responseData.data || [];
          totalItems = responseData.total || 0;
          
          renderLogs();
          updatePagination();
        } catch (err) {
          console.error("Failed to fetch session activity logs", err);
          logsTableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--danger)">Error loading logs.</td></tr>`;
        }
      }

      function updatePagination() {
        if (totalItems > limit) {
           paginationControls.style.display = "flex";
           pageIndicator.textContent = `Page ${currentPage} of ${Math.ceil(totalItems / limit)}`;
           btnPrevPage.disabled = currentPage === 1;
           btnNextPage.disabled = currentPage === Math.ceil(totalItems / limit);
        } else {
           paginationControls.style.display = "none";
        }
      }

      function renderLogs() {
        if (logsData.length === 0) {
          logsTableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted)">No logs matching the filters.</td></tr>`;
          return;
        }

        logsTableBody.innerHTML = "";
        logsData.forEach(log => {
          const row = document.createElement("tr");
          row.style.transition = "background 0.2s";
          row.onmouseover = () => row.style.background = "var(--bg-surface-hover, rgba(0,0,0,0.02))";
          row.onmouseout = () => row.style.background = "transparent";
          
          let badgeClass = "badge-neutral";
          const act = (log.activity || "").toLowerCase();
          if(act === 'start' || act === 'resume') badgeClass = "badge-success";
          else if(act === 'stop' || act === 'pause') badgeClass = "badge-danger";
          else if(act === 'rename') badgeClass = "badge-primary";

          // Format Date beautifully
          const d = new Date(log.timestamp);
          const datePart = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
          const timePart = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

          const cameraLabel = log.camera_name || "System";
          const sessionLabel = log.session_name || "Global";
          const detailsLabel = log.details || "—";

          row.innerHTML = `
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); color: var(--text-primary); font-family: 'Inter', sans-serif; white-space: nowrap;">
               <div style="font-weight: 600; font-size: 14px;">${datePart}</div>
               <div style="color: var(--text-muted); font-size: 12px; margin-top: 2px;">${timePart}</div>
            </td>
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap;">
              <div style="display: flex; align-items: center; gap: 10px;">
                 <div style="width: 28px; height: 28px; border-radius: 6px; background: var(--bg-surface-hover, #f1f5f9); display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
                   <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                 </div>
                 <span style="font-weight: 500; color: var(--text-primary); font-size: 14px;">${cameraLabel}</span>
              </div>
            </td>
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap;">
              <div style="display: flex; align-items: center; gap: 10px;">
                 <div style="width: 28px; height: 28px; border-radius: 6px; background: var(--tint-blue, #e0e7ff); color: var(--accent-blue, #3b82f6); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;">
                   ${sessionLabel.charAt(0).toUpperCase()}
                 </div>
                 <span style="font-weight: 600; color: var(--text-primary); font-size: 14px;">${sessionLabel}</span>
              </div>
            </td>
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap;">
              <span style="display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; ${
                act === 'start' || act === 'resume' ? 'background: var(--tint-green, #dcfce7); color: var(--accent-green, #16a34a);' :
                act === 'stop' || act === 'pause' ? 'background: var(--tint-red, #fee2e2); color: var(--accent-red, #dc2626);' :
                'background: var(--tint-blue, #e0e7ff); color: var(--accent-blue, #3b82f6);'
              }">
                ${log.activity}
              </span>
            </td>
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 14px; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${detailsLabel}">${detailsLabel}</td>
          `;
          logsTableBody.appendChild(row);
        });
      }

      function onFilterChange() {
        currentPage = 1;
        fetchLogs();
      }

      cameraFilter.addEventListener("change", onFilterChange);
      searchFilter.addEventListener("input", () => {
        // Debounce search
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(onFilterChange, 300);
      });
      activityFilter.addEventListener("change", onFilterChange);

      btnPrevPage.addEventListener("click", () => {
        if (currentPage > 1) {
          currentPage--;
          fetchLogs();
        }
      });
      
      btnNextPage.addEventListener("click", () => {
        const totalPages = Math.ceil(totalItems / limit);
        if (currentPage < totalPages) {
          currentPage++;
          fetchLogs();
        }
      });

      fetchLogs();
      setInterval(fetchLogs, 5000); // Auto refresh every 5s
    })();
  </script>
