  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1>Session Logs</h1>
      <div class="topbar-actions">
        <button id="themeToggle" class="btn btn-secondary icon-btn" aria-label="Toggle Theme">
          <svg id="themeIconDark" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="themeIconLight" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <div class="content">
      <p style="color: var(--text-secondary);">Real-time tracking of session events, stops, starts, renames, and counting changes.</p>
      
      <div class="filter-bar card mt-16" style="display: flex; gap: 16px; align-items: center;">
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 180px;">
          <label for="cameraFilter" style="margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase;">Filter by Camera</label>
          <select id="cameraFilter">
            <option value="">All Cameras</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 220px;">
          <label for="searchFilter" style="margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase;">Search Session Name</label>
          <input type="text" id="searchFilter" placeholder="Type session name..." style="height: 38px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 140px;">
          <label for="activityFilter" style="margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase;">Event Type</label>
          <select id="activityFilter">
            <option value="">All Events</option>
            <option value="start">Start</option>
            <option value="stop">Stop</option>
            <option value="pause">Pause</option>
            <option value="resume">Resume</option>
            <option value="rename">Rename</option>
          </select>
        </div>
      </div>

      <div class="card mt-16" style="padding: 0; overflow-x: auto; border-radius: var(--radius-lg);">
        <table class="log-table" style="width: 100%; border: none;">
          <thead>
            <tr>
              <th style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);">Logged Time</th>
              <th style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);">Camera</th>
              <th style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);">Session / Lap</th>
              <th style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);">Activity</th>
              <th style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);">Details</th>
            </tr>
          </thead>
          <tbody id="logsTableBody">
            <tr>
              <td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">Loading logs...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    (async () => {
      const logsTableBody = document.getElementById("logsTableBody");
      const cameraFilter = document.getElementById("cameraFilter");
      const searchFilter = document.getElementById("searchFilter");
      const activityFilter = document.getElementById("activityFilter");
      let allLogs = [];

      // Load cameras
      try {
        const res = await fetch("/api/cameras");
        const cams = await res.json();
        cams.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.name.toLowerCase();
          opt.textContent = c.name;
          cameraFilter.appendChild(opt);
        });
      } catch (err) {
        console.error("Failed to load cameras for filter", err);
      }

      // Fetch activity logs
      async function fetchLogs() {
        try {
          const res = await fetch("/api/sessions/activity-logs");
          allLogs = await res.json();
          renderLogs();
        } catch (err) {
          console.error("Failed to fetch session activity logs", err);
          logsTableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--danger)">Error loading logs.</td></tr>`;
        }
      }

      function renderLogs() {
        const camVal = cameraFilter.value.toLowerCase();
        const searchVal = searchFilter.value.trim().toLowerCase();
        const actVal = activityFilter.value;

        const filtered = allLogs.filter(log => {
          const logCamera = (log.camera_name || "").toLowerCase();
          const logSession = (log.session_name || "").toLowerCase();
          const logActivity = (log.activity || "").toLowerCase();

          const matchesCamera = !camVal || logCamera === camVal;
          const matchesSearch = !searchVal || logSession.includes(searchVal);
          const matchesActivity = !actVal || logActivity === actVal;

          return matchesCamera && matchesSearch && matchesActivity;
        });

        if (filtered.length === 0) {
          logsTableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted)">No logs matching the filters.</td></tr>`;
          return;
        }

        logsTableBody.innerHTML = "";
        filtered.forEach(log => {
          const row = document.createElement("tr");
          
          const badgeClass = `badge-${log.activity}`;
          const formattedDate = new Date(log.timestamp).toLocaleString();
          const cameraLabel = log.camera_name || "System";
          const sessionLabel = log.session_name || "Global";
          const detailsLabel = log.details || "—";

          row.innerHTML = `
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); color: var(--text-primary); font-weight: 500; font-family: monospace;">${formattedDate}</td>
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);">${cameraLabel}</td>
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); font-weight: 600; color: var(--text-primary);">${sessionLabel}</td>
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle);">
              <span class="log-badge ${badgeClass}">${log.activity}</span>
            </td>
            <td style="padding: 16px 24px; border-bottom: 1px solid var(--border-subtle); color: var(--text-secondary); max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${detailsLabel}</td>
          `;
          logsTableBody.appendChild(row);
        });
      }

      cameraFilter.addEventListener("change", renderLogs);
      searchFilter.addEventListener("input", renderLogs);
      activityFilter.addEventListener("change", renderLogs);

      fetchLogs();
      setInterval(fetchLogs, 5000); // Auto refresh every 5s
    })();
  </script>
