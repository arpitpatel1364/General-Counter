<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sack Counter - Laps / Sessions</title>
  <link rel="icon" type="image/png" href="/static/images/Camsense app icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=14">
</head>
<body>
  <div class="mobile-drawer-overlay" id="mobileDrawerOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <button class="sidebar-toggle-btn" id="sidebarToggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <img class="logo-full" src="/static/images/Camsense Logo-Beige -Brown.png" alt="CamSense Logo">
      <svg class="logo-small" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M8 8h8"></path><path d="M8 12h5"></path></svg>
    </div>
    <nav>
      <a href="/" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg><span class="nav-text">Dashboard</span></a>
      <a href="/sessions" class="nav-link active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path></svg><span class="nav-text">Laps / Sessions</span></a>
      <a href="/session-logs" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18"></path><path d="M7 11h10"></path><path d="M7 15h7"></path><path d="M3 5v16h18V5H3z"/></svg><span class="nav-text">Session Logs</span></a>
      <a href="/cameras" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span class="nav-text">Cameras</span></a>
      <a href="/settings" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="nav-text">Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <img src="/static/images/powered-by-logo.png" alt="Powered by CamSense">
    </div>
  </aside>

  <main class="main">
  <style>
    .session-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }
    .session-card {
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .session-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-strong);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
    }
    .session-status {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: var(--radius-full);
    }
    .status-active {
      background-color: rgba(34, 197, 94, 0.1);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
    }
    .status-closed {
      background-color: var(--bg-input);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }
    .session-stats {
      display: flex;
      gap: 16px;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px dashed var(--border-subtle);
    }
    .stat-box {
      flex: 1;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }
  </style>
    <header class="topbar" style="display: flex; justify-content: space-between; align-items: center;">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1>Laps / Sessions</h1>
      <button id="btnNewSession" class="btn btn-primary" style="display: none;">Start New Lap</button>
    </header>

    <div class="content">
      <p style="color: var(--text-secondary);">View history of counting sessions and batch runs.</p>
      
      <div class="filter-bar card mt-16">
        <label for="cameraSelect">Camera:</label>
        <select id="cameraSelect" style="width: 200px;"></select>
      </div>

      <div id="sessionsGrid" class="session-grid">
        <!-- JS generates cards here -->
      </div>
      
      <div id="emptyState" style="display: none; text-align: center; padding: 60px 20px;" class="card mt-16">
        <h3 style="color: var(--text-muted);">No sessions found.</h3>
      </div>
    </div>
  </main>

  <!-- New Session Modal -->
  <div id="newSessionModal" class="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000;">
    <div class="card" style="width: 400px; padding: 24px;">
      <h3 style="margin-top: 0; margin-bottom: 16px;">Start New Lap</h3>
      
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="sessionName">Lap Name / Truck Number</label>
        <input type="text" id="sessionName" class="form-control" placeholder="e.g. Truck-XYZ-123" style="width: 100%; margin-top: 8px;">
      </div>
      
      <div class="form-group" style="margin-bottom: 24px;">
        <label for="targetClass">Target Object</label>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <select id="targetClass" class="form-control" style="width: 100%;">
            <option value="0">Sack</option>
          </select>
        </div>
      </div>
      
      <div style="display: flex; justify-content: flex-end; gap: 12px;">
        <button id="btnCancelSession" class="btn btn-secondary">Cancel</button>
        <button id="btnStartSession" class="btn btn-primary">Start</button>
      </div>
    </div>
  </div>

  <!-- Session Analytics Modal -->
  <div id="analyticsModal" class="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000;">
    <div class="card" style="width: 800px; padding: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="analyticsModalTitle" style="margin: 0;">Session Analytics</h3>
        <button id="btnCloseAnalytics" class="btn btn-secondary" style="padding: 4px 8px;">✕</button>
      </div>
      
      <div id="sessionChartContainer" style="display: flex; align-items: flex-end; gap: 4px; height: 300px; padding: 16px; background: #070708; border-radius: var(--radius-md); border-bottom: 1px dashed var(--border-subtle); overflow-x: auto;">
        <!-- Bars will be inserted here -->
      </div>
      <div id="sessionChartEmpty" style="display: none; text-align: center; color: var(--text-muted); padding: 40px;">No data recorded for this session.</div>
    </div>
  </div>

  <!-- Tooltip -->
  <div id="sessionTooltip" class="chart-tooltip" style="display:none; position:absolute; z-index: 2000;"></div>

  <script>
    (async () => {
      const cameraSelect = document.getElementById("cameraSelect");
      const sessionsGrid = document.getElementById("sessionsGrid");
      const emptyState = document.getElementById("emptyState");
      const btnNewSession = document.getElementById("btnNewSession");
      
      // New Session Modal elements
      const newSessionModal = document.getElementById("newSessionModal");
      const btnCancelSession = document.getElementById("btnCancelSession");
      const btnStartSession = document.getElementById("btnStartSession");
      const inputName = document.getElementById("sessionName");
      const inputClass = document.getElementById("targetClass");

      // Analytics Modal elements
      const analyticsModal = document.getElementById("analyticsModal");
      const btnCloseAnalytics = document.getElementById("btnCloseAnalytics");
      const sessionChartContainer = document.getElementById("sessionChartContainer");
      const sessionChartEmpty = document.getElementById("sessionChartEmpty");
      const analyticsModalTitle = document.getElementById("analyticsModalTitle");
      const tooltip = document.getElementById("sessionTooltip");

      // Load cameras
      try {
        const res = await fetch("/api/cameras");
        const cams = await res.json();
        cams.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c.id;
          opt.textContent = c.name;
          cameraSelect.appendChild(opt);
        });
        
        if (cams.length > 0) {
          btnNewSession.style.display = 'inline-flex';
          loadSessions(cams[0].id);
        }
      } catch (err) {
        console.error("Failed to load cameras", err);
      }

      cameraSelect.addEventListener("change", () => {
        loadSessions(cameraSelect.value);
      });

      btnNewSession.addEventListener("click", () => {
        inputName.value = '';
        newSessionModal.style.display = 'flex';
      });

      btnCancelSession.addEventListener("click", () => {
        newSessionModal.style.display = 'none';
      });
      
      newSessionModal.addEventListener("click", (e) => {
        if (e.target === newSessionModal) newSessionModal.style.display = 'none';
      });

      btnStartSession.addEventListener("click", async () => {
        const name = inputName.value.trim();
        const camId = cameraSelect.value;
        if (!name || !camId) return alert('Please enter a Lap Name');
        
        newSessionModal.style.display = 'none';
        try {
          const res = await fetch('/api/sessions/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              camera_id: parseInt(camId),
              name: name,
              target_class: parseInt(inputClass.value) || 0
            })
          });
          
          if (!res.ok) {
            const data = await res.json();
            alert(data.detail || data.error || "Failed to start counting.");
            return;
          }
          
          loadSessions(camId);
        } catch (err) { console.error(err); }
      });

      btnCloseAnalytics.addEventListener("click", () => {
        analyticsModal.style.display = 'none';
      });
      
      analyticsModal.addEventListener("click", (e) => {
        if (e.target === analyticsModal) analyticsModal.style.display = 'none';
      });

      // Global functions for session actions
      window.editSession = async (id, oldName) => {
        const newName = prompt("Enter new name for lap:", oldName);
        if (newName && newName.trim() !== oldName) {
          try {
            await fetch(`/api/sessions/${id}`, {
              method: 'PUT',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ name: newName.trim() })
            });
            loadSessions(cameraSelect.value);
          } catch (e) {
            console.error(e);
          }
        }
      };

      window.viewSessionAnalytics = async (id, name) => {
        analyticsModalTitle.textContent = `Analytics: ${name}`;
        sessionChartContainer.innerHTML = '';
        sessionChartEmpty.style.display = 'none';
        analyticsModal.style.display = 'flex';
        
        try {
          const res = await fetch(`/api/analytics/session/${id}`);
          const data = await res.json();
          
          if (!data || data.length === 0) {
            sessionChartEmpty.style.display = 'block';
            return;
          }
          
          const maxCount = Math.max(1, ...data.map(d => Math.max(d.in_count, d.out_count)));
          
          data.forEach(item => {
            const timeLabel = item.time_slice.split(' ')[1]; // Extract HH:MM
            const inC = item.in_count || 0;
            const outC = item.out_count || 0;
            
            const col = document.createElement('div');
            col.style = 'display: flex; flex-direction: column; justify-content: flex-end; align-items: center; width: 40px; margin: 0 4px; cursor: pointer; flex-shrink: 0;';
            
            const wrapper = document.createElement('div');
            wrapper.style = 'display: flex; align-items: flex-end; gap: 2px; height: 250px; width: 100%;';
            
            const inH = (inC / maxCount) * 100;
            const outH = (outC / maxCount) * 100;
            
            wrapper.innerHTML = `
              <div style="width: 50%; height: ${inH}%; background: var(--accent-green); border-radius: 2px 2px 0 0;"></div>
              <div style="width: 50%; height: ${outH}%; background: var(--accent-red); border-radius: 2px 2px 0 0;"></div>
            `;
            
            col.addEventListener('mouseenter', (e) => {
              tooltip.style.display = 'block';
              tooltip.innerHTML = `<strong>${timeLabel}</strong><br>IN: <span style="color:var(--accent-green)">${inC}</span> | OUT: <span style="color:var(--accent-red)">${outC}</span>`;
              tooltip.style.left = e.pageX + 10 + 'px';
              tooltip.style.top = e.pageY - 30 + 'px';
            });
            col.addEventListener('mousemove', (e) => {
              tooltip.style.left = e.pageX + 10 + 'px';
              tooltip.style.top = e.pageY - 30 + 'px';
            });
            col.addEventListener('mouseleave', () => {
              tooltip.style.display = 'none';
            });
            
            const lbl = document.createElement('div');
            lbl.style = 'font-size: 10px; margin-top: 8px; color: var(--text-muted); text-align: center;';
            lbl.textContent = timeLabel;
            
            col.appendChild(wrapper);
            col.appendChild(lbl);
            sessionChartContainer.appendChild(col);
          });
        } catch (e) {
          console.error(e);
        }
      };

      window.resumeSession = async (id) => {
        try {
          const res = await fetch(`/api/sessions/${id}/resume`, { method: 'POST' });
          if (!res.ok) {
            const data = await res.json();
            alert(data.detail || data.error || "Failed to resume lap.");
            return;
          }
          loadSessions(cameraSelect.value);
        } catch (e) {
          console.error(e);
        }
      };

      window.stopSession = async (camId) => {
        try {
          await fetch(`/api/sessions/stop`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ camera_id: camId })
          });
          loadSessions(cameraSelect.value);
        } catch (e) {
          console.error(e);
        }
      };

      async function loadSessions(cameraId) {
        sessionsGrid.innerHTML = "";
        emptyState.style.display = "none";
        try {
          const res = await fetch(`/api/sessions/${cameraId}`);
          const sessions = await res.json();
          
          if (sessions.length === 0) {
            emptyState.style.display = "block";
            return;
          }
          
          sessions.forEach(s => {
            const date = new Date(s.created_at).toLocaleString();
            const closedDate = s.closed_at ? new Date(s.closed_at).toLocaleString() : "Active";
            
            const statusClass = s.status === 'active' ? 'status-active' : 'status-closed';
            const statusText = s.status === 'active' ? 'Active' : 'Closed';
            
            const actionButtonHtml = s.status === 'active'
              ? `<button onclick="stopSession(${s.camera_id})" class="btn btn-danger" style="padding: 6px 12px; font-size: 12px;" title="Stop Counting"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px; vertical-align: middle;"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect></svg>Stop</button>`
              : `<button onclick="resumeSession(${s.id})" class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" title="Resume Counting"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px; vertical-align: middle;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>Resume</button>`;
            
            const card = document.createElement("div");
            card.className = "card session-card";
            card.style = "display: flex; flex-direction: column; height: 100%; min-height: 240px;";
            card.innerHTML = `
              <div class="session-card-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px;">
                <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: var(--text-primary); word-break: break-all;">${s.name}</h3>
                <span class="session-status ${statusClass}" style="position: static; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: var(--radius-full); line-height: 1;">
                  ${statusText}
                </span>
              </div>
              <div class="session-card-meta" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; font-size: 12px; color: var(--text-secondary);">
                <div style="display: flex; align-items: center; gap: 8px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                  <span>Started: <span style="color: var(--text-primary);">${date}</span></span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  <span>Ended: <span style="color: var(--text-primary);">${closedDate}</span></span>
                </div>
              </div>
              
              <div class="session-card-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; background: var(--bg-input); border-radius: var(--radius-md); border: 1px solid var(--border-subtle); margin-bottom: 16px; margin-top: auto;">
                <div style="text-align: center; border-right: 1px solid var(--border-subtle); padding-right: 4px;">
                  <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Total In</div>
                  <div style="font-size: 20px; font-weight: 700; color: var(--accent-green); margin-top: 2px;">${s.total_in}</div>
                </div>
                <div style="text-align: center; padding-left: 4px;">
                  <div style="font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Total Out</div>
                  <div style="font-size: 20px; font-weight: 700; color: var(--accent-red); margin-top: 2px;">${s.total_out}</div>
                </div>
              </div>
              <div class="session-card-actions" style="display: flex; gap: 8px; border-top: 1px solid var(--border-subtle); padding-top: 14px; align-items: center;">
                <button onclick="editSession(${s.id}, '${s.name.replace(/'/g, "\\'")}')" class="btn btn-outline" style="padding: 6px 10px; flex: 1; font-size: 12px;" title="Rename Lap">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; vertical-align: middle;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                  Rename
                </button>
                ${actionButtonHtml}
                <button onclick="viewSessionAnalytics(${s.id}, '${s.name.replace(/'/g, "\\'")}')" class="btn btn-secondary" style="padding: 6px 10px; font-size: 12px;" title="View Analytics">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                </button>
              </div>
            `;
            sessionsGrid.appendChild(card);
          });
        } catch (err) {
          console.error("Failed to load sessions", err);
        }
      }
    })();
  </script>
  <nav class="mobile-bottom-nav" aria-label="Bottom navigation">
    <a href="/">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      <span>Dashboard</span>
    </a>
    <a href="/cameras">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      <span>Cameras</span>
