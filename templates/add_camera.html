<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sack Counter - Add Camera</title>
  <link rel="icon" type="image/png" href="/static/images/Camsense app icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <button class="sidebar-toggle-btn" id="sidebarToggle" type="button" aria-label="Collapse sidebar" aria-expanded="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <img class="logo-full" src="/static/images/Camsense Logo-Beige -Brown.png" alt="CamSense Logo">
      <svg class="logo-small" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M8 8h8"></path><path d="M8 12h5"></path></svg>
    </div>
    <nav>
      <a href="/" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg><span class="nav-text">Dashboard</span></a>
      <a href="/sessions" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18"></path></svg><span class="nav-text">Laps / Sessions</span></a>
      <a href="/session-logs" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18"></path><path d="M7 11h10"></path><path d="M7 15h7"></path><path d="M3 5v16h18V5H3z"/></svg><span class="nav-text">Session Logs</span></a>
      <a href="/cameras" class="nav-link active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span class="nav-text">Cameras</span></a>
      <a href="/settings" class="nav-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 0 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="nav-text">Settings</span></a>
    </nav>
    <div class="sidebar-footer">
      <img src="/static/images/powered-by-logo.png" alt="Powered by CamSense">
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>Add Camera</h1>
    </header>

    <div class="content">
      <div class="card" style="max-width: 600px; margin: 0 auto;">
        <div class="steps">
          <div class="step active">1. Camera Info</div>
          <div class="step">2. ROI Setup</div>
        </div>

        <form id="addCameraForm">
          <div class="form-group">
            <label for="camName">Camera Name</label>
            <input type="text" id="camName" name="name" required placeholder="e.g. Main Entrance">
          </div>
          
          <div class="form-group">
            <label for="camLocation">Location</label>
            <input type="text" id="camLocation" name="location" required placeholder="e.g. Lobby">
          </div>

          <div class="form-group">
            <label for="camRtsp">RTSP Stream URL</label>
            <input type="text" id="camRtsp" name="rtsp_url" required placeholder="rtsp://admin:pass@192.168.1.10:554/stream">
          </div>

          <div style="display: flex; gap: 10px; margin-top: 24px;">
            <a href="/cameras" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Next</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/static/js/main.js?v=14"></script>
</body>
</html>
