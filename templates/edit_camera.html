<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sack Counter - Edit Camera</title>
  <link rel="icon" type="image/png" href="/static/images/Camsense app icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=14">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/static/images/Camsense Logo-Beige -Brown.png" alt="CamSense Logo" style="max-height: 26px; max-width: 100%;">
    </div>
    <nav>
      <a href="/" class="nav-link">Dashboard</a>
      <a href="/sessions" class="nav-link">Laps / Sessions</a>
      <a href="/session-logs" class="nav-link">Session Logs</a>
      <a href="/cameras" class="nav-link active">Cameras</a>
      <a href="/settings" class="nav-link">Settings</a>
    </nav>
    <div class="sidebar-footer">
      <img src="/static/images/powered-by-logo.png" alt="Powered by CamSense">
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1>Edit Camera</h1>
    </header>

    <div class="content">
      <div class="card" style="max-width: 600px; margin: 0 auto; padding: 0; overflow: hidden;">
        <div style="background: var(--bg-surface-hover); padding: 24px; border-bottom: 1px solid var(--border-subtle);">
          <h3 style="margin: 0; color: var(--text-primary); font-size: 16px; font-weight: 600;">Camera Configuration</h3>
          <p class="text-muted" style="margin: 6px 0 0 0; font-size: 12px; line-height: 1.4;">Modify camera details, location, and RTSP stream URL.</p>
        </div>

        <form id="editCameraForm" style="padding: 24px;">
          <div class="form-group">
            <label for="camName" style="font-weight: 500; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;">Camera Name</label>
            <input type="text" id="camName" name="name" required placeholder="e.g. Main Entrance">
          </div>
          
          <div class="form-group">
            <label for="camLocation" style="font-weight: 500; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;">Location</label>
            <input type="text" id="camLocation" name="location" required placeholder="e.g. Lobby">
          </div>

          <div class="form-group">
            <label for="camRtsp" style="font-weight: 500; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px;">RTSP Stream URL</label>
            <input type="text" id="camRtsp" name="rtsp_url" required placeholder="rtsp://admin:pass@192.168.1.10:554/stream">
          </div>

          <div style="display: flex; gap: 10px; margin-top: 24px;">
            <a href="/cameras" class="btn btn-outline" style="flex: 1;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="flex: 1;">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/static/js/main.js?v=14"></script>
</body>
</html>
